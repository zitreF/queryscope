<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QueryScope</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%237aa2ff' stroke-width='3'/%3E%3Cpath d='M21 21l7 7' stroke='%237aa2ff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="14" cy="14" r="9"/>
            <path d="M21 21l7 7"/>
        </svg>
        QueryScope
    </div>
    <div class="stats" id="stats"></div>
    <div class="actions">
        <label class="toggle">
            <input type="checkbox" id="only-findings">
            Only with findings
        </label>
        <button type="button" id="clear">Clear</button>
        <span class="connection" id="connection">connecting</span>
    </div>
</header>
<main class="layout">
    <section class="requests" aria-label="Requests">
        <ol id="request-list"></ol>
        <p class="placeholder" id="no-requests">Waiting for HTTP requests that run SQL.</p>
    </section>
    <section class="details" id="details" aria-label="Request details"></section>
</main>
<script src="panel.js"></script>
</body>
</html>
